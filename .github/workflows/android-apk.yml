name: Android APK

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "SDKMANAGER=$SDKMANAGER"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Validate web app
        run: npm run check

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Neon-Arcade-Runner-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Arcade-Runner-test-apk
          path: apk-output/Neon-Arcade-Runner-test.apk
          if-no-files-found: error
          retention-days: 14
